name: Quality

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - '!*'
  pull_request:

jobs:
  quality:
    name: lint / typecheck / coverage / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.25.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run coverage
        run: pnpm run test:coverage

      - name: Build package
        run: pnpm run build
